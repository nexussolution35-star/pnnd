<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" role="img" aria-label="PNND Kitchen Parma">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9cd7a"/>
      <stop offset="0.45" stop-color="#cfa84e"/>
      <stop offset="1" stop-color="#a87f2e"/>
    </linearGradient>
    <radialGradient id="disc" cx="50%" cy="42%" r="65%">
      <stop offset="0" stop-color="#191919"/>
      <stop offset="0.7" stop-color="#0b0b0b"/>
      <stop offset="1" stop-color="#050505"/>
    </radialGradient>
  </defs>

  <!-- disc + gold ring -->
  <circle cx="350" cy="350" r="338" fill="#060606"/>
  <circle cx="350" cy="350" r="332" fill="url(#disc)"/>
  <circle cx="350" cy="350" r="312" fill="none" stroke="url(#gold)" stroke-width="8"/>

  <!-- PK monogram -->
  <g font-family="Georgia,'Times New Roman',serif" font-weight="700">
    <text x="262" y="430" font-size="340" fill="url(#gold)" text-anchor="middle">P</text>
    <text x="452" y="446" font-size="370" fill="#ffffff" text-anchor="middle">K</text>
  </g>

  <!-- wordmark -->
  <text x="350" y="512" font-family="Georgia,'Times New Roman',serif" font-weight="700"
        font-size="74" letter-spacing="3" fill="#ffffff" text-anchor="middle">PNND KITCHEN</text>

  <!-- PARMA with side rules -->
  <g stroke="url(#gold)" stroke-width="2.5">
    <line x1="232" y1="556" x2="288" y2="556"/>
    <line x1="412" y1="556" x2="468" y2="556"/>
  </g>
  <text x="350" y="572" font-family="Georgia,'Times New Roman',serif" font-weight="700"
        font-size="46" letter-spacing="14" fill="url(#gold)" text-anchor="middle">PARMA</text>

  <!-- tagline -->
  <text x="354" y="616" font-family="'Poppins',Arial,sans-serif" font-weight="600"
        font-size="22" letter-spacing="5" fill="url(#gold)" text-anchor="middle">DESIGN • QUALITY • PERFECTION</text>
</svg>
