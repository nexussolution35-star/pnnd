<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="PNND Kitchen Parma">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7c66a"/>
      <stop offset="0.5" stop-color="#c9a24b"/>
      <stop offset="1" stop-color="#a87f2e"/>
    </linearGradient>
  </defs>
  <circle cx="120" cy="120" r="118" fill="#0a0a0a"/>
  <circle cx="120" cy="120" r="111" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
  <!-- PK monogram -->
  <g font-family="'Cormorant Garamond', Georgia, serif" font-weight="700">
    <text x="86" y="128" font-size="118" fill="url(#gold)" text-anchor="middle">P</text>
    <text x="150" y="138" font-size="128" fill="#ffffff" text-anchor="middle">K</text>
  </g>
  <!-- wordmark -->
  <text x="120" y="172" font-size="25" letter-spacing="2" fill="#ffffff" text-anchor="middle"
        font-family="'Cormorant Garamond', Georgia, serif" font-weight="700">PNND KITCHEN</text>
  <g stroke="url(#gold)" stroke-width="1.4">
    <line x1="58" y1="186" x2="92" y2="186"/>
    <line x1="148" y1="186" x2="182" y2="186"/>
  </g>
  <text x="120" y="192" font-size="15" letter-spacing="6" fill="url(#gold)" text-anchor="middle"
        font-family="'Cormorant Garamond', Georgia, serif" font-weight="600">PARMA</text>
  <text x="120" y="210" font-size="8.5" letter-spacing="2.5" fill="#cdb27a" text-anchor="middle"
        font-family="'Montserrat', Arial, sans-serif" font-weight="500">DESIGN • QUALITY • PERFECTION</text>
</svg>
